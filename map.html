<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storybound — Chapter Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lora:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d29">
<link rel="stylesheet" href="css/create.css">
<link rel="stylesheet" href="css/map.css">
</head>
<body>

<div class="map-stage view">
  <div class="map-topbar">
    <button class="icon-btn" id="back-btn" aria-label="Back to book">←</button>
    <div class="map-topbar__title" id="map-title">Loading…</div>
  </div>

  <p class="map-note">Each dot is an episode. Chapters group episodes in order. (A fully draggable map is planned — this is the list version for now.)</p>

  <div id="chapters"></div>

  <div class="detail-panel" id="detail-panel">
    <h3 id="detail-title"></h3>
    <p id="detail-summary"></p>
    <button type="button" class="wizard-btn wizard-btn--primary" id="jump-btn">Jump to this episode</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/map.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
