<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storybound — Sign in</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lora:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d29">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-stage">
  <div class="book-card view">
    <div class="book-card__eyebrow">Storybound</div>
    <h1 class="book-card__title"><span class="drop">Y</span>our library awaits</h1>
    <p class="book-card__subtitle" id="subtitle">Sign in to return to your shelf.</p>

    <div class="form-message" id="form-message"></div>

    <form id="auth-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="seal-button" id="submit-btn">Enter the library</button>
    </form>

    <div class="switch-mode">
      <span id="mode-label">New here?</span>
      <button type="button" id="switch-btn">Create an account</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
